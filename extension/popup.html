<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 -apple-system, sans-serif; width: 320px; padding: 12px 14px; margin: 0; color: #1f2328; }
      h1 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
      h1 img { width: 16px; height: 16px; }
      h2 { font-size: 12px; color: #59636e; font-weight: 600; margin: 12px 0 4px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .on { background: #2ea043; }
      .off { background: #cf222e; }
      .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 8px; margin: 4px 0; }
      .pending { border-color: #d4790b; background: #fff8ed; }
      .meta { color: #59636e; font-size: 12px; word-break: break-all; }
      .row { display: flex; gap: 6px; margin-top: 6px; }
      input { flex: 1; font: 15px ui-monospace, monospace; letter-spacing: 1px; padding: 4px 6px; text-transform: uppercase; border: 1px solid #d0d7de; border-radius: 4px; }
      button { font: inherit; padding: 3px 10px; border-radius: 4px; border: 1px solid #d0d7de; background: #f6f8fa; cursor: pointer; }
      button.primary { background: #1f3a60; color: #fff; border-color: #1f3a60; }
      button.link { border: none; background: none; color: #cf222e; padding: 0; font-size: 12px; }
      .msg { font-size: 12px; margin-top: 4px; min-height: 16px; }
      .err { color: #cf222e; }
      .ok { color: #1a7f37; }
      .hint { color: #59636e; font-size: 12px; margin-top: 10px; }
      code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
      .agent { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    </style>
  </head>
  <body>
    <h1><img src="icon48.png" alt="" />Chrome Bridge</h1>
    <div><span id="dot" class="dot off"></span><span id="state">检查中…</span></div>

    <section id="pairBox" hidden>
      <h2>待配对</h2>
      <div id="pendingList"></div>
      <div class="row">
        <input id="code" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" spellcheck="false" />
        <button id="pairBtn" class="primary">配对</button>
      </div>
      <div id="pairMsg" class="msg"></div>
    </section>

    <section id="sessionBox" hidden>
      <h2>已接入的会话</h2>
      <div id="sessionList"></div>
    </section>

    <section id="agentBox" hidden>
      <h2>已配对的 agent</h2>
      <div id="agentList"></div>
    </section>

    <div class="hint" id="hint"></div>
    <script src="popup.js"></script>
  </body>
</html>
